name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # config/rates/rps-2022.json is bundled into the browser for the
      # calculators; migration 005 seeds the database the server reads. If they
      # drift, the page and the database disagree about what an employee is
      # owed and nothing else in this workflow notices.
      - name: Rates seed matches its config
        run: node scripts/generate-rates-seed.mjs --check

      # SETUP.md tells a non-programmer to paste supabase/all-migrations.sql
      # into the SQL Editor. If it has drifted from supabase/migrations/, they
      # build the wrong schema and nothing says so.
      - name: Migration bundle matches the migrations
        run: node scripts/bundle-migrations.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  schema:
    name: migration · schema smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Postgres major version of the Supabase local stack, with
        # pgvector preinstalled.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      # The roles, the auth schema and the default privileges Supabase provides
      # and a bare Postgres image does not. Shared with scripts/schema-check.sh
      # so a failure here can be reproduced locally without pushing.
      - name: Shim what Supabase provides
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/000_supabase_shim.sql

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Schema smoke test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/001_schema_smoke.sql

  eval:
    name: golden-set eval
    runs-on: ubuntu-latest
    steps:
      # The eval needs a live corpus and model keys, so it can only run where
      # those exist. It reports skipped rather than red on a repository without
      # them — a gate nobody can satisfy yet is a gate people learn to ignore.
      - id: guard
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] || [ -z "${{ secrets.EVAL_CHAT_URL }}" ]; then
            echo "::notice::Skipping the golden-set eval: set the EVAL_CHAT_URL and GEMINI_API_KEY secrets to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.guard.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Exits non-zero below the 90% cite rate PLAN.md Phase 2 specifies.
      - if: steps.guard.outputs.configured == 'true'
        name: Run the golden set
        env:
          CHAT_URL: ${{ secrets.EVAL_CHAT_URL }}
        run: pnpm eval
